<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Potong Buah Pro - Acode</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: #162447;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #162447;
            transition: opacity 0.3s ease;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        input[type="text"], select {
            width: 80%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            text-align: center;
            background: #fff;
            color: #1a1a2e;
            font-weight: bold;
        }
        button {
            background: #e43f5a;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        #game-screen {
            background: #0f3460;
            position: relative;
            overflow: hidden;
            display: none;
        }
        #game-screen.active {
            display: flex;
        }
        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .item {
            position: absolute;
            font-size: 48px;
            cursor: pointer;
            transition: transform 0.1s;
            animation: floatUp linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-750px) rotate(360deg); }
        }
        .leaderboard-box {
            background: #1f4068;
            padding: 15px;
            border-radius: 8px;
            width: 85%;
            margin-top: 15px;
            max-height: 180px;
            overflow-y: auto;
        }
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
        }
        .stats-info {
            font-size: 14px;
            color: #4ecca3;
            margin-top: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN 1: INPUT NAMA, LEVEL & LEADERBOARD -->
    <div id="start-screen" class="screen">
        <h1>🍉 Fruit Slicer 🗡️</h1>
        <p style="margin-top: 0; font-size: 14px; color: #ccc;">Potong buah sebanyak-banyaknya sebelum waktu habis!</p>
        
        <input type="text" id="player-name" placeholder="Masukkan Nama Peserta" autocomplete="off">
        
        <select id="difficulty-select">
            <option value="easy">Level: Mudah (Waktu 40d, Lambat)</option>
            <option value="medium" selected>Level: Sedang (Waktu 30d, Normal)</option>
            <option value="hard">Level: Sulit (Waktu 25d, Cepat + Banyak Bom)</option>
        </select>

        <button onclick="startGame()">Mulai Game</button>

        <div class="stats-info" id="total-players-info">Total Pemain: 0</div>

        <div class="leaderboard-box">
            <h3 style="margin-top: 0; font-size: 16px;">🏆 Top 5 Juara Tertinggi</h3>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <!-- SCREEN 2: AREA GAME -->
    <div id="game-screen" class="screen">
        <div class="hud">
            <span id="hud-name">Player</span>
            <span>⏱️ <span id="hud-time">30</span>s</span>
            <span>⭐ <span id="hud-score">0</span></span>
        </div>
        <div id="play-area" style="width: 100%; height: 100%; position: relative;"></div>
    </div>

    <!-- SCREEN 3: GAME OVER -->
    <div id="gameover-screen" class="screen hidden">
        <h2>Waktu Habis! ⏰</h2>
        <p style="font-size: 18px;">Peserta: <b id="end-player-name">-</b></p>
        <p style="font-size: 24px; color: #4ecca3;">Skor Akhir: <b id="final-score">0</b></p>
        <button onclick="resetToHome()">Kembali ke Menu</button>
    </div>
</div>

<script>
    let playerName = "";
    let score = 0;
    let timeLeft = 30;
    let timerInterval = null;
    let spawnerInterval = null;
    let currentConfig = {};

    // Konfigurasi per tingkat kesulitan
    const difficultySettings = {
        easy: {
            time: 40,
            spawnRate: 800,
            minSpeed: 2.2,
            maxSpeed: 3.0,
            items: ['🍎', '🍌', '🍉', '🍇', '🍓', '🍍', '💣'] // 1 dari 7 peluang bom
        },
        medium: {
            time: 30,
            spawnRate: 600,
            minSpeed: 1.5,
            maxSpeed: 2.3,
            items: ['🍎', '🍌', '🍉', '🍇', '🍓', '💣', '💣'] // 2 dari 7 peluang bom
        },
        hard: {
            time: 25,
            spawnRate: 420,
            minSpeed: 1.0,
            maxSpeed: 1.7,
            items: ['🍎', '🍉', '🍍', '💣', '💣', '💣'] // 3 dari 6 peluang bom
        }
    };

    // --- Sistem Efek Suara (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSliceSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    }

    function playBombSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.35);

        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    }

    function playGameOverSound() {
        if (!audioCtx) return;
        const notes = [440, 392, 349.23, 293.66];
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i + 1) * 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + i * 0.15);
            osc.stop(audioCtx.currentTime + (i + 1) * 0.15);
        });
    }

    // --- Logika Permainan ---
    window.onload = function() {
        updateLeaderboardUI();
        updateTotalPlayersUI();
    };

    function startGame() {
        const input = document.getElementById('player-name');
        playerName = input.value.trim();

        if (playerName === "") {
            alert("Harap masukkan nama peserta terlebih dahulu!");
            return;
        }

        // Aktifkan audio pada interaksi klik pertama
        initAudio();

        const selectedLevel = document.getElementById('difficulty-select').value;
        currentConfig = difficultySettings[selectedLevel];

        document.getElementById('start-screen').classList.add('hidden');
        const gameScreen = document.getElementById('game-screen');
        gameScreen.classList.add('active');

        score = 0;
        timeLeft = currentConfig.time;
        document.getElementById('hud-name').innerText = playerName;
        document.getElementById('hud-score').innerText = score;
        document.getElementById('hud-time').innerText = timeLeft;

        incrementTotalPlayers();

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('hud-time').innerText = timeLeft;
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);

        spawnerInterval = setInterval(spawnItem, currentConfig.spawnRate);
    }

    function spawnItem() {
        const playArea = document.getElementById('play-area');
        const item = document.createElement('div');
        item.classList.add('item');

        const itemPool = currentConfig.items;
        const randomItem = itemPool[Math.floor(Math.random() * itemPool.length)];
        item.innerHTML = randomItem;

        const randomX = Math.random() * (playArea.clientWidth - 65);
        item.style.left = randomX + 'px';
        item.style.bottom = '-60px';

        const randomDuration = Math.random() * (currentConfig.maxSpeed - currentConfig.minSpeed) + currentConfig.minSpeed;
        item.style.animationDuration = randomDuration + 's';

        let isSliced = false;

        item.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (isSliced) return;
            isSliced = true;

            if (randomItem === '💣') {
                playBombSound();
                score -= 10;
                if (score < 0) score = 0;
                item.innerHTML = '💥';
                item.style.transform = 'scale(1.6)';
                item.style.opacity = '0';
            } else {
                playSliceSound();
                score += 10;
                item.style.transform = 'scale(0) rotate(180deg)';
                item.style.opacity = '0';
            }
            document.getElementById('hud-score').innerText = score;
            setTimeout(() => item.remove(), 200);
        });

        playArea.appendChild(item);

        setTimeout(() => {
            if (item.parentElement) {
                item.remove();
            }
        }, randomDuration * 1000);
    }

    function endGame() {
        clearInterval(timerInterval);
        clearInterval(spawnerInterval);
        playGameOverSound();

        document.getElementById('play-area').innerHTML = "";
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('gameover-screen').classList.remove('hidden');
        
        document.getElementById('end-player-name').innerText = playerName;
        document.getElementById('final-score').innerText = score;

        saveScore(playerName, score);
    }

    function resetToHome() {
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
        document.getElementById('player-name').value = "";
        updateLeaderboardUI();
        updateTotalPlayersUI();
    }

    // --- Penyimpanan Data (LocalStorage) ---
    function getLeaderboard() {
        let data = localStorage.getItem('fruit_slicer_leaderboard');
        return data ? JSON.parse(data) : [];
    }

    function saveScore(name, finalScore) {
        let leaderboard = getLeaderboard();
        const levelLabel = document.getElementById('difficulty-select').value.toUpperCase();
        leaderboard.push({ name: `${name} (${levelLabel})`, score: finalScore });
        
        leaderboard.sort((a, b) => b.score - a.score);

        if (leaderboard.length > 5) {
            leaderboard = leaderboard.slice(0, 5);
        }

        localStorage.setItem('fruit_slicer_leaderboard', JSON.stringify(leaderboard));
    }

    function updateLeaderboardUI() {
        let leaderboard = getLeaderboard();
        let listContainer = document.getElementById('leaderboard-list');
        listContainer.innerHTML = "";

        if (leaderboard.length === 0) {
            listContainer.innerHTML = "<div style='font-size:12px; color:#aaa;'>Belum ada data juara.</div>";
            return;
        }

        leaderboard.forEach((item, index) => {
            let div = document.createElement('div');
            div.classList.add('leaderboard-item');
            div.innerHTML = `<span>#${index + 1} ${item.name}</span> <span><b>${item.score} pts</b></span>`;
            listContainer.appendChild(div);
        });
    }

    function incrementTotalPlayers() {
        let total = localStorage.getItem('fruit_slicer_total_players');
        total = total ? parseInt(total) + 1 : 1;
        localStorage.setItem('fruit_slicer_total_players', total);
        updateTotalPlayersUI();
    }

    function updateTotalPlayersUI() {
        let total = localStorage.getItem('fruit_slicer_total_players') || 0;
        document.getElementById('total-players-info').innerText = `Total Pemain: ${total} Orang`;
    }
</script>

</body>
</html>
